C.w=Math.round(w*s);C.h=Math.round(h*s);C.x=cl(C.x,0,S.w-C.w);C.y=cl(C.y,0,S.h-C.h);draw();out()}
function cropUpd(){cropBox()}
function draw(){const cv=C.cv,k=Math.min(1,900/S.w);cv.width=S.w*k;cv.height=S.h*k;const x=cv.getContext('2d');
x.drawImage(S.i,0,0,cv.width,cv.height);x.fillStyle='rgba(27,21,48,.55)';
const X=C.x*k,Y=C.y*k,W=C.w*k,H=C.h*k;x.fillRect(0,0,cv.width,Y);x.fillRect(0,Y+H,cv.width,cv.height);x.fillRect(0,Y,X,H);x.fillRect(X+W,Y,cv.width,H);
x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(X,Y,W,H)}
function out(){const ty=$('#kf').value,o=document.createElement('canvas');o.width=C.w;o.height=C.h;const x=o.getContext('2d');
if(ty=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,C.w,C.h)}x.drawImage(S.i,C.x,C.y,C.w,C.h,0,0,C.w,C.h);
o.toBlob(b=>b?show(b,ty,1):err('Crop failed.'),ty,.95)}
